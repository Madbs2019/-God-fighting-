<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>史诗烦灾官网</title>
    <!-- 引入图标库 -->
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            color: #fff;
            overflow: hidden;
        }
        /* 背景轮播 */
        .bg-wrap {
            position: fixed;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }
        .bg-item {
            position: absolute;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 2.5s ease-in-out;
        }
        .bg-item.active {
            opacity: 1;
        }
        .bg1 {
            background-image: url("1.png");
        }
        .bg2 {
            background-image: url("2.png");
        }
        .mask {
            position: fixed;
            inset: 0;
            background-color: rgba(0,0,0,0.72);
            z-index: -1;
        }
        /* 主体容器 */
        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        h1 {
            font-size: 42px;
            margin-bottom: 32px;
            letter-spacing: 2px;
            text-align: center;
        }
        /* 标签按钮布局 半透明+毛玻璃 */
        .tab-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: min(620px, 95vw);
            margin-bottom: 24px;
        }
        .tab-btn {
            padding: 12px 8px;
            font-size: 17px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background-color: rgba(24, 24, 24, 0.35);
            backdrop-filter: blur(6px);
            color: #fff;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
        }
        .tab-btn:hover {
            background-color: rgba(60, 60, 60, 0.45);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.35);
        }
        .tab-btn.active {
            background-color: rgba(80, 80, 80, 0.55);
            border-color: rgba(255, 255, 255, 0.45);
        }
        /* 内容面板 半透明毛玻璃 */
        .tab-content-wrap {
            width: min(620px, 95vw);
            background-color: rgba(20, 20, 20, 0.35);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 28px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            min-height: 260px;
        }
        .tab-content {
            display: none;
            animation: fadeIn 0.35s ease;
        }
        .tab-content.show {
            display: block;
        }
        @keyframes fadeIn {
            from {opacity:0; transform: translateY(8px);}
            to {opacity:1; transform: translateY(0);}
        }
        .content-title {
            font-size:24px;
            margin-bottom:20px;
            text-align:center;
        }
        .desc-text {
            margin:14px 0 24px;
            color:#cccccc;
            font-size:16px;
            text-align:center;
        }
        /* 操作按钮半透明毛玻璃 */
        .action-btn {
            display: block;
            width: 100%;
            max-width: 360px;
            margin: 12px auto;
            padding:13px 26px;
            background-color: rgba(40, 40, 40, 0.4);
            backdrop-filter: blur(6px);
            color:#fff;
            border-radius:10px;
            text-decoration:none;
            border:1px solid rgba(255,255,255,0.2);
            transition: all 0.25s ease;
            font-size:16px;
            cursor:pointer;
            text-align:center;
        }
        .action-btn:hover {
            background-color: rgba(70, 70, 70, 0.55);
            transform: scale(1.03);
            border-color: rgba(255, 255, 255, 0.4);
        }
        /* 图标间距 */
        .action-btn i {
            margin-right: 10px;
            font-size:18px;
        }
    </style>
</head>
<body>
    <!-- 背景 -->
    <div class="bg-wrap">
        <div class="bg-item bg1 active"></div>
        <div class="bg-item bg2"></div>
    </div>
    <div class="mask"></div>

    <div class="container">
        <h1>史诗烦灾官网</h1>

        <!-- 标签切换按钮【网格等宽布局】 -->
        <div class="tab-buttons">
            <button class="tab-btn active" data-tab="tab1">整合包</button>
            <button class="tab-btn" data-tab="tab2">模组</button>
            <button class="tab-btn" data-tab="tab3">洛辰的动画</button>
            <button class="tab-btn" data-tab="tab4">社交账号</button>
        </div>

        <!-- 标签内容区域 -->
        <div class="tab-content-wrap">
            <!-- 整合包 -->
            <div class="tab-content show" id="tab1">
                <div class="content-title">整合包</div>
                <a href="https://pan.quark.cn/s/bf4731aec12e" target="_blank" class="action-btn">下载整合包</a>
                <p class="desc-text">整合包作者:洛辰不是牢辰</p>
            </div>

            <!-- 模组 -->
            <div class="tab-content" id="tab2">
                <div class="content-title">模组</div>
                <a href="Legendary Sword.jar" download class="action-btn">下载模组</a>
                <p class="desc-text">模组作者:洛辰不是牢辰</p>
            </div>

            <!-- 洛辰的动画 -->
            <div class="tab-content" id="tab3">
                <div class="content-title">洛辰的动画</div>
                <a href="抽象待机.json" download class="action-btn">抽象待机.json</a>
                <a href="待机.json" download class="action-btn">待机.json</a>
            </div>

            <!-- 社交账号（新增QQ群按钮） -->
            <div class="tab-content" id="tab4">
                <div class="content-title">社交账号</div>
                <a href="http://www.youtube.com/@%E6%B4%9B%E8%BE%B0%E4%B8%8D%E6%98%AF%E7%89%A2%E8%BE%B0-r1s" target="_blank" class="action-btn">
                    <i class="fa-brands fa-youtube"></i>YouTube｜洛辰不是牢辰
                </a>
                <a href="https://b23.tv/OKS6coP" target="_blank" class="action-btn">
                    <i class="fa-brands fa-bilibili"></i>B站｜洛辰不是牢辰
                </a>
                <a href="https://v.douyin.com/LRSrls30AF4/" target="_blank" class="action-btn">
                    <i class="fa-solid fa-music"></i>抖音｜洛辰
                </a>
                <a href="https://v.kuaishou.com/JnivWPAw" target="_blank" class="action-btn">
                    <i class="fa-solid fa-film"></i>快手｜洛辰Rid
                </a>
                <a href="https://qm.qq.com/cgi-bin/qm/qr?k=yourkey" target="_blank" class="action-btn">
                    <i class="fa-brands fa-qq"></i>QQ群：1090441872
                </a>
            </div>
        </div>
    </div>

<script>
// 背景自动切换
const bgList = document.querySelectorAll('.bg-item');
let currentBg = 0;
function switchBg(){
    bgList[currentBg].classList.remove('active');
    currentBg = (currentBg + 1) % bgList.length;
    bgList[currentBg].classList.add('active');
}
setInterval(switchBg, 5000);

// 标签切换逻辑
const tabBtns = document.querySelectorAll('.tab-btn');
const tabContents = document.querySelectorAll('.tab-content');
tabBtns.forEach(btn=>{
    btn.onclick = function(){
        // 清除全部激活
        tabBtns.forEach(b=>b.classList.remove('active'));
        tabContents.forEach(c=>c.classList.remove('show'));
        // 激活当前
        this.classList.add('active');
        const targetTabId = this.getAttribute('data-tab');
        document.getElementById(targetTabId).classList.add('show');
    }
})
</script>
</body>
</html>
